<html lang="ru">
<head>

<title>Бюджет</title>
<style>
:root{
  --bg:#EDF2F5; --surface:#FFFFFF; --ink:#12303C; --muted:#5E7482; --line:#D8E2E8;
  --teal:#0E6F78; --teal-d:#0A5961; --teal-l:#DCF0F1;
  --blue:#2A63B8; --blue-l:#E1ECFA;
  --rose:#B5405A; --rose-l:#FAE5EA;
  --amber:#A8620A; --amber-l:#FFF0D2;
  --violet:#5B4BB0; --violet-l:#ECE8FA;
  --ok:#1F7A4D; --ok-l:#DFF3E7;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:190px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(32px + var(--sab))}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--surface);
  padding:calc(7px + var(--sat)) 12px 0;border-bottom:1px solid var(--line);
  box-shadow:0 2px 10px rgba(18,48,60,.06)}
.brand{display:flex;align-items:baseline;gap:10px;margin:0 2px 6px}
.brand h1{font-size:17px;margin:0;letter-spacing:.2px;white-space:nowrap}
.brand .asof{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .ver{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.seg{display:flex;gap:8px;margin:0 0 7px}
.seg button{flex:1;min-width:0;border:2px solid var(--line);background:#F6F9FB;border-radius:11px;padding:6px 10px;text-align:center}
.seg button b{display:block;font-size:16px;font-weight:700;line-height:1.25}
.seg button span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button.on span{color:#B9CCD6}
.seg button.zero{opacity:.6}
.tabs{display:flex;gap:4px;margin:0 0 7px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 98px;min-width:0;border:1.5px solid var(--line);background:#F6F9FB;border-radius:10px;padding:6px 4px;text-align:center}
.tab b{display:block;font-size:12.5px;font-weight:650;line-height:1.2;overflow-wrap:anywhere}
.tab span{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.zero{opacity:.55}
.tab.on{background:var(--teal);border-color:var(--teal);color:#fff;opacity:1}
.tab.on span{color:#CBEAEC}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:14px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.2;pointer-events:none}
.search input{width:100%;height:46px;padding:0 64px 0 44px;font-size:18px;color:var(--ink);
  background:#F6F9FB;border:2px solid var(--line);border-radius:14px;outline:none;
  -webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--teal);background:#fff;box-shadow:0 0 0 4px rgba(14,111,120,.14)}
.search input::placeholder{color:#8AA0AC}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.clear{position:absolute;right:5px;top:5px;width:36px;height:36px;border:0;border-radius:10px;
  background:var(--teal);color:#fff;font-size:26px;line-height:1;display:none;align-items:center;justify-content:center;padding:0}
.clear.on{display:flex}
.clear:active{background:var(--teal-d)}
.hint{font-size:12.5px;color:var(--muted);margin:4px 2px 0}
.hint code{background:#EAF0F4;border-radius:5px;padding:1px 5px;font:inherit;color:var(--teal-d);cursor:pointer}
.frow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:8px 0 9px}
.fsel{height:34px;min-width:0;max-width:100%;flex:1 1 140px;border:1.5px solid var(--line);background:#F6F9FB;border-radius:10px;padding:0 8px;font:600 13px/1 inherit;font-family:inherit;color:var(--ink)}
.fsel.act{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}
.fx{border:0;background:none;color:var(--teal-d);font-weight:600;font-size:13px;padding:6px 4px;text-decoration:underline}
main{max-width:820px;margin:0 auto;padding:12px 12px 0}
.stat{font-size:13px;color:var(--muted);margin:2px 2px 10px}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.lhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.lhead .stat{margin:0}
.copybtn{border:0;background:var(--teal);color:#fff;border-radius:11px;padding:10px 16px;font-weight:700;font-size:14px}
.copybtn:active{background:var(--teal-d)}
.copybtn.alt{background:var(--teal-l);color:var(--teal-d)}
.copybtn.alt:active{background:#C3E4E6}
.copybtn.done,.copybtn.alt.done{background:var(--ok);color:#fff}
.cbtns{display:flex;flex-wrap:wrap;gap:8px}
.empty,.loading{background:var(--surface);border:1px dashed #B9C9D2;border-radius:14px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty button{margin-top:12px;border:0;background:var(--teal);color:#fff;border-radius:10px;padding:10px 18px;font-weight:600}
.g{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.gm{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 14px 10px;color:inherit;
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.gm *{-webkit-user-select:text;user-select:text}
.gm .cp{-webkit-user-select:none;user-select:none}
.g.open .gm{background:#F4F8FA}
.gh{display:flex;gap:12px;align-items:flex-start}
.gh .l{flex:1;min-width:0}
.code{font:600 12.5px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--teal-d);
  background:var(--teal-l);padding:2px 7px;border-radius:6px;display:inline-block;letter-spacing:.2px}
.code.nc{background:#EEF1F3;color:#6A7A86}
.code.old{background:#F1EDE3;color:#7A5A12}
.cl{display:flex;flex-wrap:wrap;align-items:center;gap:3px 4px}
.oldc{display:inline-flex;align-items:center;gap:2px;margin-left:8px;font-size:12px;color:var(--muted)}
.oldc i{font-style:normal;margin-right:3px}
.cp{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:24px;height:24px;border:0;border-radius:7px;background:transparent;color:#7C93A0;padding:0}
.cp svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cp:hover{background:#E1EBF0;color:var(--teal-d)}
.cp.done{color:var(--ok)}
@media (pointer:coarse){.cp{width:30px;height:30px}}
.name{margin:6px 0 0;font-size:15px;font-weight:560;word-break:break-word}
.name.dim{color:var(--muted);font-weight:500}
.qty{text-align:right;flex:0 0 auto;max-width:44%}
.qty b{display:block;font-size:20px;line-height:1.05;font-variant-numeric:tabular-nums;font-weight:700}
.qty i{font-style:normal;font-size:12.5px;color:var(--muted)}
.qty small{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
mark{background:#FFE08A;color:inherit;border-radius:3px;padding:0 1px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700}
.tag.ini{background:#E7EEF2;color:#41606F}
.tag.plan{background:var(--violet-l);color:var(--violet)}
.tag.ok{background:var(--ok-l);color:var(--ok)}
.tag.part{background:var(--amber-l);color:var(--amber)}
.tag.none{background:var(--rose-l);color:var(--rose)}
.tag.date{background:var(--blue-l);color:var(--blue)}
.det{display:none;padding:2px 14px 12px;background:#F4F8FA;border-top:1px solid #EAF0F3}
.g.open .det{display:block}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0;font-size:13.5px}
.det dt{color:var(--muted)}
.det dd{margin:0;word-break:break-word;font-weight:560}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:0;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:650;white-space:nowrap}
.chip.exec{background:var(--ok-l);color:var(--ok)}
.chip.plan{background:var(--violet-l);color:var(--violet)}
.chip.print{background:var(--blue-l);color:var(--blue)}
.chip.none{background:#EEF1F3;color:#6A7A86;cursor:default}
.chip:active{filter:brightness(.93)}
.more{display:block;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:600;color:var(--teal-d);margin:2px 0 10px}
.top-btn{position:fixed;right:14px;bottom:calc(16px + var(--sab));width:46px;height:46px;border:0;border-radius:50%;
  background:var(--ink);color:#fff;box-shadow:0 4px 14px rgba(18,48,60,.35);display:none;align-items:center;justify-content:center}
.top-btn.on{display:flex}
.top-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4}
:focus-visible{outline:3px solid #6FB8BF;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){.top{padding-left:max(12px,calc((100vw - 820px)/2));padding-right:max(12px,calc((100vw - 820px)/2))}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Бюджет</h1><span class="asof" id="asof"></span><span class="ver" id="ver" title="Нажми, чтобы обновить приложение"></span></div>
  <div class="seg" id="seg"></div>
  <div class="tabs" id="tabs"></div>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="Код, наименование, заказчик, поставщик…" aria-label="Поиск">
    <button class="clear" id="clr" aria-label="Очистить поиск">&times;</button>
  </div>
  <div class="hint" id="hint">К примеру, если надо поискать трубу 89 диаметра, то пиши <code data-ex="*труба*89*">*труба*89*</code>.</div>
  <div class="frow" id="ctl"></div>
</header>
<main id="main"><div class="loading">Загрузка данных…</div></main>
<button class="top-btn" id="up" aria-label="Наверх"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button>

<script>
(function(){
'use strict';
var APP_BUILD={v:'3',t:'22.11.2026'};
var YEARS=['2026','2027'];
var LOOK={a:'а',c:'с',e:'е',o:'о',p:'р',x:'х',y:'у',k:'к',m:'м',t:'т',b:'в',h:'н','ё':'е'};
function norm(s){return String(s==null?'':s).toLowerCase().replace(/[acepoxykmtbhё]/g,function(c){return LOOK[c]})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n,d){var x=Math.round(n*1000)/1000;return x.toLocaleString('ru-RU',{maximumFractionDigits:d==null?3:d})}
function fdate(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?m[3]+'.'+m[2]+'.'+m[1]:(s||'')}
function statusCls(st){
  st=String(st||'').toLowerCase();
  if(/не\s*сост|отмен|расторг|возврат/.test(st))return 'none';
  if(/^сост/.test(st))return 'ok';
  return 'part';
}
function split(v){return v?String(v).split(/\s*;\s*/).filter(Boolean):[]}
function one(i){return function(r){return r[i]?[r[i]]:[]}}
function validCode(c){return /\d/.test(c||'')}
/* Старый и новый код одного товара. Связь берём из строк, где оба кода есть (исполнение, ПТД), и применяем ко всем разделам */
var OLD2NEW={},NEW2OLD={};
function buildAlt(){
  OLD2NEW={};NEW2OLD={};
  TABS.forEach(function(T){
    if(T.old==null)return;
    Y[T.id].forEach(function(r){
      var n=r[T.code],o=r[T.old];
      if(validCode(n)&&validCode(o)&&n!==o){
        if(!OLD2NEW[o])OLD2NEW[o]=n;
        var a=NEW2OLD[n]||(NEW2OLD[n]=[]);if(a.indexOf(o)<0)a.push(o);
      }
    });
  });
}
/* основной код строки: новый, а если его нет, то старый */
function codeRaw(T,r){
  var c=r[T.code];if(validCode(c))return c;
  var o=T.old!=null?r[T.old]:'';return validCode(o)?o:'';
}
/* все коды товара для поиска и связи между разделами */
function codeKeys(T,r){
  var a=[];
  function add(c){if(validCode(c)&&a.indexOf(c)<0)a.push(c)}
  add(r[T.code]);if(T.old!=null)add(r[T.old]);
  a.slice().forEach(function(c){add(OLD2NEW[c]);(NEW2OLD[c]||[]).forEach(add)});
  return a;
}
/* что показать рядом с кодом: старый код (если основной новый) или новый код (если основной старый) */
function altInfo(T,r){
  var p=codeRaw(T,r);if(!p)return null;
  var o=T.old!=null?r[T.old]:'';
  if(validCode(o)&&o!==p)return {lab:'ст. код',codes:[o]};
  if(NEW2OLD[p])return {lab:'ст. код',codes:NEW2OLD[p].slice(0,3)};
  if(OLD2NEW[p])return {lab:'нов. код',codes:[OLD2NEW[p]]};
  return null;
}

/* ---------- описание трёх вкладок года ----------
   code/name/unit/qty/sum: индексы в строке; search: по каким полям искать;
   tags: плашки под наименованием; det: подробности; filt: выпадающие фильтры */
var TABS=[
  {id:'exec',t:'1-Исполнение',s:'закупки, договоры',
   code:0,old:12,name:1,unit:2,qty:4,sum:5,search:[0,1,3,6,7,8,10,12],
   tags:function(r){var a=[];split(r[3]).forEach(function(c){a.push(['ini',c])});
     if(r[6])a.push(['plan',r[6]]);
     if(r[7])a.push([statusCls(r[7]),'заявка: '+r[7]]);
     if(r[8])a.push([statusCls(r[8]),'закупка: '+r[8]]);return a},
   det:[['Заказчик',3],['Способ закупок',6],['Статус заявки',7],['Статус закупки',8],['Дата вскрытия',9,'d'],['Поставщик',10],['Дата договора',11,'d']],
   cols:[['Код товара',0],['Старый код',12],['Наименование',1],['Ед. изм.',2],['Заказчик',3],['Кол-во',4,'n'],['Сумма, ₸ без НДС',5,'n'],['Способ закупок',6],
         ['Статус заявки',7],['Статус закупки',8],['Дата вскрытия',9,'d'],['Поставщик',10],['Дата договора',11,'d']],
   filt:[{k:'cust',l:'Заказчик',get:function(r){return split(r[3])}},{k:'meth',l:'Способ закупок',get:one(6)},
         {k:'st1',l:'Статус заявки',get:one(7)},{k:'st2',l:'Статус закупки',get:one(8)}]},
  {id:'plan',t:'1-План закупок',s:'бюджет',
   code:2,name:3,unit:null,qty:4,sum:6,search:[0,1,2,3,8,9,10],
   tags:function(r){var a=[];if(r[1])a.push(['ini',r[1]]);if(r[0])a.push(['date',r[0]]);
     if(r[8])a.push(['plan',r[8]]);
     if(r[9])a.push([statusCls(r[9]),'закупка: '+r[9]]);
     if(r[10])a.push(['part',r[10]]);return a},
   det:[['Тип',0],['Заказчик (бюджет)',1],['Цена за ед., ₸ без НДС',5,'n'],['Дата заявки',7,'d'],['Способ закупок',8],['Статус закупок',9],['Статус несостоявшейся',10]],
   cols:[['Тип',0],['Заказчик (бюджет)',1],['Код товара',2],['Старый код',null,'old'],['Новый код',null,'new'],['Наименование',3],['Кол-во',4,'n'],['Цена за ед., ₸ без НДС',5,'n'],
         ['Сумма, ₸ без НДС',6,'n'],['Дата заявки',7,'d'],['Способ закупок',8],['Статус закупок',9],['Статус несостоявшейся',10]],
   filt:[{k:'cust',l:'Заказчик',get:one(1)},{k:'type',l:'Тип',get:one(0)},{k:'meth',l:'Способ закупок',get:one(8)},
         {k:'st',l:'Статус закупок',get:one(9)}]},
  {id:'print',t:'3-Бюджетная заявка',s:'после корректировки',
   code:3,name:null,unit:null,qty:4,sum:null,search:[0,1,2,3,6],
   tags:function(r){var a=[];if(r[0])a.push(['ini',r[0]]);if(r[1])a.push(['plan',r[1]]);return a},
   det:[['АБП',0],['Цех',1],['Код ГПЗ',2],['Цена, ₸ без НДС',5,'n'],['Примечание',6]],
   cols:[['АБП',0],['Цех',1],['Код ГПЗ',2],['Код товара',3],['Старый код',null,'old'],['Наименование',null,'name'],['Ед. изм.',null,'unit'],['Кол-во',4,'n'],
         ['Цена, ₸ без НДС',5,'n'],['Примечание',6]],
   filt:[{k:'abp',l:'АБП',get:one(0)},{k:'cex',l:'Цех',get:one(1)}]}
];
TABS.push(
  {id:'ptd',t:'Бюджет АБП ПТД',s:'потребность по товарам',
   code:0,old:1,name:2,unit:3,qty:7,sum:9,sumNote:true,search:[0,1,2,4,5,6,10,11,13],
   tags:function(r){var a=[];if(r[4])a.push(['ini',r[4]]);if(r[5])a.push(['plan',r[5]]);if(r[6])a.push(['date',r[6]]);
     if(r[10])a.push(['part',r[10]]);return a},
   det:[['Старый код',1],['Заказчик / департамент',4],['МВЗ / цех',5],['Статья бюджета',6],['Цена, ₸ без НДС',8,'n'],
        ['Причина закупа',10],['Обоснование',11],['Ссылка на товар',12,'u'],['Примечание',13]],
   cols:[['Код товара',0],['Старый код',1],['Наименование',2],['Ед. изм.',3],['Заказчик / департамент',4],['МВЗ / цех',5],['Статья бюджета',6],
         ['Кол-во',7,'n'],['Цена, ₸ без НДС',8,'n'],['Сумма, ₸ без НДС',9,'n'],['Причина закупа',10],['Обоснование',11],['Ссылка на товар',12],['Примечание',13]],
   filt:[{k:'cex',l:'МВЗ / цех',get:one(5)},{k:'art',l:'Статья бюджета',get:one(6)},{k:'cust',l:'Заказчик',get:one(4)},{k:'reason',l:'Причина закупа',get:one(10)}]},
  {id:'uzheo',t:'Бюджет АБП УЖЭО',s:'по цехам',
   code:2,name:3,unit:4,qty:7,sum:null,search:[0,1,2,3,5,6],
   tags:function(r){var a=[];if(r[0])a.push(['ini',r[0]]);if(r[5])a.push(['plan',r[5]]);if(r[1])a.push(['date',r[1]]);return a},
   det:[['АБП',0],['Код ФП (статья)',1],['Цех',5],['Код МВЗ по SAP',6]],
   cols:[['АБП',0],['Код ФП',1],['Код',2],['Старый код',null,'old'],['Новый код',null,'new'],['Наименование',3],['Ед. изм.',4],['Цех',5],['Код МВЗ по SAP',6],['Кол-во',7,'n']],
   filt:[{k:'cex',l:'Цех',get:one(5)},{k:'art',l:'Код ФП',get:one(1)}]}
);
var TB={};TABS.forEach(function(t){TB[t.id]=t});

var D=null,Y={},F={},H={},KEYS={},OPT={},CNT={},NAMES={},UNITS={};
var S={year:'2026',tab:'exec',q:'',f:{},limit:50,open:{}};
try{var sy=localStorage.getItem('budget_year');if(sy&&YEARS.indexOf(sy)>=0)S.year=sy}catch(e){}
var $q=document.getElementById('q'),$clr=document.getElementById('clr'),$main=document.getElementById('main'),
    $seg=document.getElementById('seg'),$tabs=document.getElementById('tabs'),$ctl=document.getElementById('ctl'),
    $hint=document.getElementById('hint'),$up=document.getElementById('up');

/* ---------- поиск (как в Excel: * и ? , несколько кодов подряд) ---------- */
function parseQ(q){
  q=q.trim();
  var qn=q.replace(/[–—−‑]/g,'-'),cs=qn.match(/\d{3}-\d{5}/g);
  if(cs&&cs.length>=1&&!qn.replace(/\d{3}-\d{5}/g,'').replace(/[\s,;]+/g,'')){
    var set={},ord=[];cs.forEach(function(c){if(!set[c]){set[c]=1;ord.push(c)}});
    return {codes:set,wild:null,toks:ord.length===1?[{s:ord[0]}]:[]};
  }
  if(/[*?]/.test(q)){
    var n=norm(q),src=n.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*+/g,'.*').replace(/\?/g,'.');
    return {wild:new RegExp('^'+src+'$'),toks:n.split(/[*?]+/).filter(Boolean).map(function(t){return {s:t}})};
  }
  return {wild:null,toks:norm(q).split(/\s+/).filter(Boolean).map(function(t){return {s:t}})};
}
function hit(tab,i,P){
  var T=TB[tab];
  if(P.codes){var ks=KEYS[tab][i];for(var q=0;q<ks.length;q++)if(P.codes[ks[q]])return true;return false}
  if(P.wild){var f=F[tab][i];for(var k=0;k<f.length;k++)if(P.wild.test(f[k]))return true;return false}
  var h=H[tab][i];
  for(var j=0;j<P.toks.length;j++)if(h.indexOf(P.toks[j].s)<0)return false;
  return true;
}
function match(tab,P){
  var n=Y[tab].length,idx=[],all=!P.codes&&!P.toks.length&&!P.wild;
  for(var i=0;i<n;i++)if(all||hit(tab,i,P))idx.push(i);
  return idx;
}
function hl(orig,toks){
  if(!toks||!toks.length)return esc(orig);
  var n=norm(orig),rg=[],i;
  toks.forEach(function(t){var p=0;while((i=n.indexOf(t.s,p))>=0){rg.push([i,i+t.s.length]);p=i+t.s.length}});
  if(!rg.length)return esc(orig);
  rg.sort(function(a,b){return a[0]-b[0]});
  var out='',pos=0;
  rg.forEach(function(r){if(r[1]<=pos)return;var a=Math.max(r[0],pos);out+=esc(orig.slice(pos,a))+'<mark>'+esc(orig.slice(a,r[1]))+'</mark>';pos=r[1]});
  return out+esc(orig.slice(pos));
}

/* ---------- подготовка данных выбранного года ---------- */
function nameOf(code){return NAMES[code]||''}
function prep(){
  var yd=(D.years&&D.years[S.year])||{};
  Y={};F={};H={};KEYS={};OPT={};CNT={};NAMES={};UNITS={};
  TABS.forEach(function(T){Y[T.id]=(yd[T.id]&&yd[T.id].rows)||[]});
  /* названия и единицы для бюджетной заявки берём из исполнения и плана по коду товара */
  Y.plan.forEach(function(r){if(r[2]&&r[3]&&!NAMES[r[2]])NAMES[r[2]]=r[3]});
  Y.ptd.forEach(function(r){if(validCode(r[0])&&r[2]&&!NAMES[r[0]])NAMES[r[0]]=r[2]});
  Y.uzheo.forEach(function(r){if(validCode(r[2])&&r[3]&&!NAMES[r[2]])NAMES[r[2]]=r[3]});
  Y.exec.forEach(function(r){if(r[0]&&r[1])NAMES[r[0]]=r[1];if(r[0]&&r[2])UNITS[r[0]]=r[2]});
  buildAlt();
  TABS.forEach(function(T){
    var rows=Y[T.id];
    KEYS[T.id]=rows.map(function(r){return codeKeys(T,r)});
    F[T.id]=rows.map(function(r,i){
      var f=T.search.map(function(c){return norm(r[c])});
      if(T.name==null)f.push(norm(nameOf(r[T.code])));
      KEYS[T.id][i].forEach(function(k){f.push(norm(k))});
      return f;
    });
    H[T.id]=F[T.id].map(function(f){return f.join(' ')});
    CNT[T.id]={};KEYS[T.id].forEach(function(ks){ks.forEach(function(c){CNT[T.id][c]=(CNT[T.id][c]||0)+1})});
    OPT[T.id]=T.filt.map(function(fl){
      var cnt={};rows.forEach(function(r){fl.get(r).forEach(function(v){cnt[v]=(cnt[v]||0)+1})});
      return Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]||(a<b?-1:1)});
    });
  });
}
function yearInfo(y){
  var yd=(D.years&&D.years[y])||{},n=0,upd='';
  TABS.forEach(function(T){if(yd[T.id]){n++;upd=yd[T.id].upd||upd}});
  return {n:n,upd:upd};
}

/* ---------- копирование в Excel ---------- */
function tcell(x){return String(x==null?'':x).replace(/[\t\r\n]+/g,' ').trim()}
function tnum(x){return String(Math.round(x*1000)/1000).replace('.',',')}
function buildTable(T,idx){
  var rows=[];
  idx.forEach(function(i){
    var r=Y[T.id][i],a=altInfo(T,r);
    rows.push(T.cols.map(function(c){
      if(c[2]==='name')return nameOf(r[T.code]);
      if(c[2]==='unit')return UNITS[r[T.code]]||'';
      if(c[2]==='old')return a&&a.lab==='ст. код'?a.codes.join('; '):'';
      if(c[2]==='new')return a&&a.lab==='нов. код'?a.codes.join('; '):'';
      var v=r[c[1]];
      return c[2]==='n'?tnum(v):c[2]==='d'?fdate(v):v;
    }));
  });
  /* колонки, в которых у найденных строк ничего нет, в таблицу не берём */
  var keep=T.cols.map(function(c,k){
    if(c[0]==='Кол-во')return true;
    return rows.some(function(r){var v=String(r[k]==null?'':r[k]).trim();return v!==''&&v!=='0'});
  });
  var head=T.cols.map(function(c){return c[0]}).filter(function(_,k){return keep[k]});
  var body=rows.map(function(r){return r.filter(function(_,k){return keep[k]})});
  return [head].concat(body).map(function(r){return r.map(tcell).join('\t')}).join('\n');
}
var ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
var ICON_OK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function copyRaw(text,cb){
  function fallback(){
    var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);cb(ok);
  }
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(function(){cb(true)},fallback);else fallback();
}
function copyText(text,btn,okMsg){
  copyRaw(text,function(ok){
    var old=btn.getAttribute('data-label');btn.textContent=ok?okMsg:'Не удалось скопировать';btn.classList.toggle('done',ok);
    setTimeout(function(){btn.textContent=old;btn.classList.remove('done')},2200);
  });
}
function copyIcon(btn,text){
  copyRaw(text,function(ok){
    btn.innerHTML=ok?ICON_OK:ICON;btn.classList.toggle('done',ok);
    if(ok){btn.title='Скопировано';setTimeout(function(){btn.innerHTML=ICON;btn.classList.remove('done');btn.title='Копировать код'},1300)}
  });
}
function copyBtn(code){return '<button class="cp" data-cc="'+esc(code)+'" title="Копировать код" aria-label="Копировать код '+esc(code)+'">'+ICON+'</button>'}
function hasSel(){var s=window.getSelection&&window.getSelection();return !!(s&&String(s).length)}

/* ---------- фильтры и вывод ---------- */
function filtered(tab,P,withFilters){
  var idx=match(tab,P);
  if(!withFilters)return idx;
  var T=TB[tab],fs=S.f[tab]||{},act=T.filt.filter(function(fl){return fs[fl.k]});
  if(!act.length)return idx;
  return idx.filter(function(i){
    var r=Y[tab][i];
    return act.every(function(fl){return fl.get(r).indexOf(fs[fl.k])>=0});
  });
}
function renderHead(P){
  var ys=YEARS.concat(Object.keys((D&&D.years)||{}).filter(function(y){return YEARS.indexOf(y)<0})).sort();
  $seg.innerHTML=ys.map(function(y){
    var inf=yearInfo(y);
    return '<button data-year="'+y+'" class="'+(y===S.year?'on':'')+(inf.n?'':' zero')+'"><b>'+y+'</b><span>'+(inf.n?'разделов: '+inf.n+' из '+TABS.length+' · на '+esc(inf.upd.slice(0,5)):'пока нет данных')+'</span></button>';
  }).join('');
  $tabs.innerHTML=TABS.map(function(T){
    var n=Y[T.id].length?match(T.id,P).length:0;
    return '<button class="tab'+(T.id===S.tab?' on':'')+(n?'':' zero')+'" data-tab="'+T.id+'"><b>'+T.t+'</b><span>'+fmt(n,0)+'</span></button>';
  }).join('');
  var on=$tabs.querySelector('.on');if(on)$tabs.scrollLeft=on.offsetLeft-($tabs.clientWidth-on.offsetWidth)/2;
  var yd=(D.years&&D.years[S.year])||{},blk=yd[S.tab],a=document.getElementById('asof');
  a.textContent=blk?(TB[S.tab].t+' на '+blk.upd+(blk.ver?' · '+blk.ver:'')):'';
}
function renderCtl(){
  var T=TB[S.tab],fs=S.f[S.tab]||{},html='',any=false;
  if(!Y[S.tab].length){$ctl.innerHTML='';return}
  T.filt.forEach(function(fl,k){
    var opts=OPT[S.tab][k];if(opts.length<2)return;
    if(fs[fl.k])any=true;
    html+='<select class="fsel'+(fs[fl.k]?' act':'')+'" data-f="'+fl.k+'" aria-label="'+esc(fl.l)+'"><option value="">'+esc(fl.l)+': все</option>'+
      opts.map(function(v){return '<option value="'+esc(v)+'"'+(fs[fl.k]===v?' selected':'')+'>'+esc(v)+'</option>'}).join('')+'</select>';
  });
  if(any)html+='<button class="fx" data-fclear>Сбросить</button>';
  $ctl.innerHTML=html;
}
function det(T,r){
  var h='<dl>';
  var u=T.unit!=null?r[T.unit]:UNITS[r[T.code]]||'';
  h+='<dt>Кол-во</dt><dd>'+fmt(r[T.qty])+(u?' '+esc(u):'')+'</dd>';
  if(T.sum!=null)h+='<dt>Сумма, ₸ без НДС</dt><dd>'+fmt(r[T.sum],2)+'</dd>';
  T.det.forEach(function(d){
    var v=r[d[1]];if(v===''||v==null)return;
    h+='<dt>'+esc(d[0])+'</dt><dd>'+(d[2]==='u'&&/^https?:\/\//i.test(v)?'<a href="'+esc(v)+'" target="_blank" rel="noopener noreferrer">'+esc(v)+'</a>':esc(d[2]==='d'?fdate(v):d[2]==='n'?fmt(v,2):v))+'</dd>';
  });
  h+='</dl>';
  var ck=codeKeys(T,r),code=ck[0];
  if(code){
    h+='<div class="links">';
    TABS.forEach(function(X){
      var n=0;ck.forEach(function(c){n=Math.max(n,CNT[X.id][c]||0)});
      if(X.id===T.id)return;
      h+=n?'<button class="chip '+X.id+'" data-go="'+X.id+'" data-q="'+esc(code)+'">'+X.t+' · '+n+'</button>':'<span class="chip none">'+X.t+' · нет</span>';
    });
    h+='</div>';
  }
  return h;
}
function card(T,i,P){
  var r=Y[T.id][i],id=T.id+':'+i,code=codeRaw(T,r),fromOld=code&&!validCode(r[T.code]),
      name=T.name!=null?r[T.name]:nameOf(r[T.code]),
      u=T.unit!=null?r[T.unit]:UNITS[r[T.code]]||'',a=altInfo(T,r);
  var h='<div class="g'+(S.open[id]?' open':'')+'" data-id="'+id+'"><div class="gm" role="button" tabindex="0" data-row="'+id+'"><div class="gh"><div class="l">'+
    '<div class="cl"><span class="code'+(code?(fromOld?' old':''):' nc')+'">'+(code?hl(code,P.toks):'без кода')+'</span>'+(code?copyBtn(code):'')+
    (fromOld?'<span class="oldc"><i>(старый код)</i></span>':'')+
    (a?'<span class="oldc"><i>'+a.lab+'</i>'+a.codes.map(function(c){return '<span class="code old">'+hl(c,P.toks)+'</span>'+copyBtn(c)}).join(' ')+'</span>':'')+'</div>'+
    '<p class="name'+(name?'':' dim')+'">'+(name?hl(name,P.toks):'наименование не указано')+'</p></div>'+
    '<div class="qty"><b>'+fmt(r[T.qty])+'</b>'+(u?'<i>'+esc(u)+'</i>':'')+
    (T.sum!=null&&r[T.sum]?'<small>'+fmt(r[T.sum],0)+' ₸</small>':'')+'</div></div>';
  var tg=T.tags(r);
  if(tg.length)h+='<div class="tags">'+tg.map(function(t){return '<span class="tag '+t[0]+'">'+hl(t[1],P.toks)+'</span>'}).join('')+'</div>';
  h+='</div><div class="det">'+det(T,r)+'</div></div>';
  return h;
}
function renderMain(P){
  var T=TB[S.tab],yd=(D.years&&D.years[S.year])||{};
  if(!yearInfo(S.year).n){
    $main.innerHTML='<div class="empty"><b>Данные за '+S.year+' год ещё не загружены</b>Они появятся здесь после загрузки Excel-файлов в папку input.</div>';
    return;
  }
  if(!yd[T.id]){
    $main.innerHTML='<div class="empty"><b>Нет файла «'+T.t+'» за '+S.year+' год</b>Загрузи его в папку input, и вкладка заполнится.</div>';
    return;
  }
  var idx=filtered(T.id,P,true),rows=Y[T.id];
  if(!idx.length){
    $main.innerHTML='<div class="empty"><b>Ничего не найдено</b>Попробуй изменить запрос или сбросить фильтры.'+
      '<br><button data-reset>Сбросить всё</button></div>';
    return;
  }
  var stat='Найдено строк: <b>'+fmt(idx.length,0)+'</b>';
  if(T.sum!=null){var t=0,withSum=0;idx.forEach(function(i){var v=rows[i][T.sum]||0;t+=v;if(v>0)withSum++});
    stat+=' · сумма <b>'+fmt(t,0)+' ₸</b> без НДС';
    if(T.sumNote&&withSum<idx.length)stat+=' <span title="У остальных строк цена не указана">(указана у '+fmt(withSum,0)+' из '+fmt(idx.length,0)+')</span>'}
  S.copyText=buildTable(T,idx);S.copyN=idx.length;
  var seen={},codes=[];idx.forEach(function(i){var c=codeRaw(T,rows[i]);if(c&&!seen[c]){seen[c]=1;codes.push(c)}});
  S.copyCodes=codes.join('\n');S.copyCodesN=codes.length;
  var html='<div class="lhead"><div class="stat">'+stat+'</div><div class="cbtns">'+
    '<button class="copybtn" data-copy data-label="Скопировать для Excel">Скопировать для Excel</button>'+
    '<button class="copybtn alt" data-copycodes data-label="Скопировать коды">Скопировать коды</button></div></div>',lim=Math.min(S.limit,idx.length);
  for(var k=0;k<lim;k++)html+=card(T,idx[k],P);
  if(lim<idx.length)html+='<button class="more" data-more>Показать ещё ('+fmt(idx.length-lim,0)+')</button>';
  $main.innerHTML=html;
}
function render(){
  var P=parseQ(S.q);
  renderHead(P);renderCtl();renderMain(P);
  $hint.style.display=S.q?'none':'';
  document.getElementById('ver').textContent='v'+APP_BUILD.v+' · '+APP_BUILD.t;
}

/* ---------- события ---------- */
var tm=null;
/* ищем по всем трём разделам сразу: если в текущем ничего нет, а в другом есть, открываем тот, где нашлось */
function autoTab(){
  if(!S.q.trim()||!D)return;
  var P=parseQ(S.q);
  if(Y[S.tab].length&&match(S.tab,P).length)return;
  for(var k=0;k<TABS.length;k++){var id=TABS[k].id;if(Y[id].length&&match(id,P).length){S.tab=id;return}}
}
function setQ(v){S.q=v;S.limit=50;$clr.classList.toggle('on',!!v);if($q.value!==v)$q.value=v;autoTab();render()}
function setYear(y){
  S.year=y;S.limit=50;S.f={};S.open={};
  try{localStorage.setItem('budget_year',y)}catch(e){}
  prep();
}
$q.addEventListener('input',function(){clearTimeout(tm);var v=$q.value;$clr.classList.toggle('on',!!v);tm=setTimeout(function(){S.q=v;S.limit=50;autoTab();render()},110)});
$q.addEventListener('paste',function(e){
  var t=(e.clipboardData||window.clipboardData).getData('text');
  if(/[\r\n\t;,]/.test(t)){e.preventDefault();var v=t.replace(/[\r\n\t;,]+/g,' ').replace(/\s+/g,' ').trim(),a=$q.selectionStart,b=$q.selectionEnd;
    $q.value=$q.value.slice(0,a)+v+$q.value.slice(b);$q.dispatchEvent(new Event('input'))}
});
$q.addEventListener('keydown',function(e){if(e.key==='Enter')$q.blur();if(e.key==='Escape')setQ('')});
$clr.addEventListener('click',function(){setQ('');$q.focus()});
$hint.addEventListener('click',function(e){var c=e.target.closest('[data-ex]');if(c){setQ(c.getAttribute('data-ex'));window.scrollTo(0,0)}});
document.querySelector('.top').addEventListener('click',function(e){
  var t=e.target,b;
  if(t.closest('#ver')){
    var kill=[];if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)kill.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
    if(window.caches)kill.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));
    Promise.all(kill).then(function(){location.reload()},function(){location.reload()});return;
  }
  if((b=t.closest('[data-year]'))){setYear(b.getAttribute('data-year'));render();window.scrollTo(0,0);return}
  if((b=t.closest('[data-tab]'))){S.tab=b.getAttribute('data-tab');S.limit=50;render();window.scrollTo(0,0);return}
  if(t.closest('[data-fclear]')){S.f[S.tab]={};S.limit=50;render();return}
});
$ctl.addEventListener('change',function(e){
  var sel=e.target.closest('[data-f]');
  if(sel){(S.f[S.tab]=S.f[S.tab]||{})[sel.getAttribute('data-f')]=sel.value;S.limit=50;render()}
});
$main.addEventListener('click',function(e){
  var t=e.target,go=t.closest('[data-go]');
  if(go){S.tab=go.getAttribute('data-go');S.f={};S.limit=50;setQ(go.getAttribute('data-q'));window.scrollTo(0,0);return}
  var cc=t.closest('[data-cc]');
  if(cc){e.stopPropagation();copyIcon(cc,cc.getAttribute('data-cc'));return}
  var cp=t.closest('[data-copy]');
  if(cp){copyText(S.copyText||'',cp,'Скопировано ✓ (строк: '+S.copyN+')');return}
  var cq=t.closest('[data-copycodes]');
  if(cq){
    if(!S.copyCodesN){cq.textContent='Нет кодов';setTimeout(function(){cq.textContent=cq.getAttribute('data-label')},1800);return}
    copyText(S.copyCodes||'',cq,'Скопировано ✓ (кодов: '+S.copyCodesN+')');return}
  if(t.closest('[data-reset]')){S.f={};setQ('');return}
  if(t.closest('[data-more]')){S.limit+=50;render();return}
  var r=t.closest('[data-row]');
  if(r){
    /* чтобы текст можно было выделять мышью: карточка раскрывается только по простому щелчку без выделения */
    clearTimeout(rowTimer);
    if(e.detail>1||hasSel())return;
    if(coarse){toggleRow(r);return}
    rowTimer=setTimeout(function(){if(!hasSel())toggleRow(r)},230);
  }
});
var rowTimer=null,coarse=!!(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches);
function toggleRow(r){var id=r.getAttribute('data-row');S.open[id]=!S.open[id];r.parentNode.classList.toggle('open',!!S.open[id])}
$main.addEventListener('keydown',function(e){
  var r=e.target.closest&&e.target.closest('[data-row]');
  if(r&&e.target===r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggleRow(r)}
});
window.addEventListener('scroll',function(){$up.classList.toggle('on',window.scrollY>600)},{passive:true});
$up.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});

fetch('data.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
  D=d;prep();render();
}).catch(function(err){
  $main.innerHTML='<div class="empty"><b>Не удалось загрузить данные</b>Проверь интернет и обнови страницу. ('+esc(err.message)+')</div>';
});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
