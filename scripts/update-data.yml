name: Обновление данных

on:
  push:
    paths:
      - 'input/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python scripts/build_data.py
      - name: Коммит данных и очистка истории
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # В репозитории остаётся ровно один коммит: старые Excel-файлы и старые версии данных нигде не хранятся.
          git checkout --orphan clean
          git add -A
          git commit -q -m "Данные от $(date -u +%Y-%m-%d)"
          git push -f origin clean:main
